inputs_def:
  - handle: audio_file
    description: The audio file to transcribe. Supports multiple formats including
      MP3, MP4, WAV, WebM, FLAC, Opus, PCM, Vorbis, and AAC.
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        excludeAll: false
        filters:
          - name: MP3
            extensions:
              - mp3
          - name: MP4
            extensions:
              - m4a
              - mp4
          - name: WAV
            extensions:
              - wav
              - wave
          - name: WebM
            extensions:
              - weba
              - webm
          - name: FLAC
            extensions:
              - flac
              - fla
          - name: Opus
            extensions:
              - opus
              - oga
              - ogg
          - name: PCM
            extensions:
              - pcm
              - raw
              - snd
          - name: Vorbis
            extensions:
              - ogg
              - oga
          - name: AAC
            extensions:
              - aac
    nullable: false
  - handle: model
    description: Pre-loaded Whisper model instance from the Whisper Model block. If
      not provided, a default model will be loaded automatically.
    json_schema:
      contentMediaType: oomol/var
    kind: model
    value:
    nullable: true
  - handle: word_timestamps
    description: Require Whisper's timestamps to be accurate to the word level
    json_schema:
      type: boolean
    value: false
  - handle: prompt
    description: Optional text to provide context for the transcription. Helps
      improve accuracy by giving Whisper hints about content, terminology, or
      speaking style.
    json_schema:
      anyOf:
        - type: string
        - type: array
      ui:options:
        title: Prompt
      ui:widget: llm::messages
    value:
      []
    schema_overrides:
      - schema:
          type: array
outputs_def:
  - handle: text
    description: The complete transcribed text from the audio file as a single string
    json_schema:
      type: string
  - handle: segments
    description: Detailed transcription segments with timestamps, probabilities, and
      word-level information for each portion of the audio
    json_schema:
      type: array
      items:
        type: object
        required:
          - text
          - avg_logprob
          - compression_ratio
          - id
          - no_speech_prob
          - seek
          - start
          - end
          - temperature
          - tokens
        properties:
          text:
            type: string
          avg_logprob:
            type: number
          compression_ratio:
            type: number
          id:
            type: integer
          no_speech_prob:
            type: number
          seek:
            type: number
          start:
            type: number
          end:
            type: number
          temperature:
            type: number
          tokens:
            type: array
            items:
              type: number
          words:
            type: array
            items:
              type: object
              properties:
                start:
                  type: number
                end:
                  type: number
                word:
                  type: string
                probability:
                  type: number
  - handle: language
    description: The detected or specified language of the audio content (e.g.,
      'en', 'es', 'fr')
    json_schema:
      type: string
ui:
  default_width: 450
executor:
  name: python
  options:
    spawn: false
    entry: main.py
title: Whisper
description: Use Whisper, OpenAI's open-source automatic speech recognition
  (ASR) system, to transcribe audio files into text with detailed segments and
  timestamps.
private: false
